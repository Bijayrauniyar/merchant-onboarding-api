version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: merchant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-merchant_onboarding}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-merchant_onboarding}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - merchant_network

  redis:
    image: redis:7-alpine
    container_name: merchant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - merchant_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  merchant_network:
    driver: bridge
